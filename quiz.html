<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検準2級 でる順パス単 単語テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;background:#f4f6f8;color:#222;min-height:100vh;padding:20px}
.container{max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:20px;text-align:center;color:#1a5490}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
label{font-size:.9rem;color:#555;min-width:80px}
input[type=number],input[type=text]{padding:10px 12px;font-size:1rem;border:1.5px solid #ccd;border-radius:8px;outline:none;font-family:inherit}
input:focus{border-color:#1a5490}
input[type=number]{width:100px}
input[type=text]{width:100%;font-size:1.3rem;text-align:center}
button{padding:10px 18px;font-size:1rem;border:none;border-radius:8px;background:#1a5490;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
button:hover{background:#143e6d}
button:active{transform:scale(.97)}
button.ghost{background:#e4e8ec;color:#333}
button.ghost:hover{background:#d6dbdf}
button.danger{background:#c33}
button.danger:hover{background:#a22}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.presets button{font-size:.82rem;padding:6px 10px;background:#eef2f5;color:#1a5490}
.presets button:hover{background:#dde4e9}
.options{display:flex;gap:18px;align-items:center;margin:14px 0;flex-wrap:wrap}
.options label{display:flex;align-items:center;gap:6px;min-width:auto;cursor:pointer}
.progress{font-size:.85rem;color:#888;text-align:right;margin-bottom:8px}
.pos-tag{display:inline-block;background:#1a5490;color:#fff;padding:3px 12px;border-radius:14px;font-size:.82rem;margin-bottom:12px}
.jp{font-size:1.9rem;font-weight:600;text-align:center;margin:10px 0 20px;color:#222;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.result-line{padding:10px;border-radius:8px;margin:8px 0;font-size:1rem}
.result-line.ok{background:#e8f5e9;color:#2e7d32}
.result-line.ng{background:#ffebee;color:#c62828}
.hint{text-align:center;color:#888;font-size:.9rem;margin:6px 0;min-height:1.3em;letter-spacing:.2em}
.action-row{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.summary{text-align:center;padding:20px 0}
.score{font-size:2.5rem;font-weight:700;color:#1a5490}
.score-sub{color:#666;margin-top:4px}
.wrong-list{margin-top:16px}
.wrong-list h3{font-size:1rem;margin-bottom:10px;color:#555}
.wrong-item{display:flex;justify-content:space-between;padding:8px 12px;background:#fff3f3;border-radius:6px;margin:6px 0;font-size:.95rem}
.wrong-item .w{font-weight:600;color:#c62828}
.wrong-item .j{color:#666}
.info{color:#666;font-size:.85rem;text-align:center;margin-top:8px}
.hide{display:none}
#gate{position:fixed;inset:0;background:#1a5490;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#gate .gate-box{background:#fff;border-radius:12px;padding:32px 28px;max-width:360px;width:100%;text-align:center}
#gate h2{font-size:1.1rem;margin-bottom:16px;color:#1a5490}
#gate input{width:100%;padding:12px;font-size:1.1rem;border:1.5px solid #ccd;border-radius:8px;margin-bottom:12px;text-align:center;font-family:inherit;outline:none}
#gate input:focus{border-color:#1a5490}
#gate button{width:100%}
#gate .err{color:#c33;font-size:.85rem;min-height:1.2em;margin-top:8px}
@media(max-width:480px){
  h1{font-size:1.2rem}
  .jp{font-size:1.6rem}
  input[type=text]{font-size:1.2rem}
  .card{padding:18px}
}
</style>
</head>
<body>

<!-- パスワードゲート -->
<div id="gate">
  <div class="gate-box">
    <h2>🔒 パスワード入力</h2>
    <form id="gateForm">
      <input type="password" id="gateInput" autocomplete="off" autofocus>
      <button type="submit">開く</button>
    </form>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="container" style="display:none" id="mainContainer">
  <h1>英検準2級 でる順パス単 テスト</h1>

  <!-- 画面1: 範囲選択 -->
  <div id="screen-setup" class="card">
    <div class="row">
      <label>開始番号</label>
      <input type="number" id="from" min="1" max="1500" value="1">
      <label style="min-width:auto">〜</label>
      <label>終了番号</label>
      <input type="number" id="to" min="1" max="1500" value="20">
    </div>
    <div class="presets" id="presets"></div>
    <div class="options">
      <label>出題順:
        <select id="orderMode" style="padding:6px 8px;border:1.5px solid #ccd;border-radius:6px;font-family:inherit;font-size:.9rem">
          <option value="order">順番</option>
          <option value="random">ランダム</option>
          <option value="errors">間違えた回数が多い順</option>
        </select>
      </label>
      <label><input type="checkbox" id="idiomToggle"> 熟語(1101-1500)も含む</label>
    </div>
    <div class="action-row">
      <button id="startBtn">テスト開始</button>
    </div>
    <p class="info" id="setupInfo">全1495問（単語1100 + 熟語395）</p>
    <div class="action-row" style="margin-top:4px">
      <button id="resetErrorsBtn" class="ghost" style="font-size:.8rem;padding:5px 10px">間違い記録をリセット</button>
    </div>
  </div>

  <!-- 画面2: 出題 -->
  <div id="screen-quiz" class="card hide">
    <div class="progress" id="progress">1 / 20</div>
    <div style="text-align:center"><span class="pos-tag" id="posTag">動詞</span></div>
    <div class="jp" id="jpText">---</div>
    <div class="hint" id="hintText"></div>
    <form id="answerForm">
      <input type="text" id="answerInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="スペルを入力">
    </form>
    <div class="action-row">
      <button type="button" id="hintBtn" class="ghost">ヒント（頭文字）</button>
      <button type="button" id="skipBtn" class="ghost">分からない</button>
      <button type="button" id="submitBtn">答え合わせ</button>
    </div>
    <div class="action-row" style="margin-top:16px">
      <button type="button" id="quitBtn" class="ghost" style="font-size:.85rem;padding:6px 12px">中断して最初へ</button>
    </div>
  </div>

  <!-- 判定表示 -->
  <div id="screen-judge" class="card hide">
    <div id="judgeText" class="result-line"></div>
    <div class="action-row">
      <button type="button" id="nextBtn">次へ</button>
    </div>
  </div>

  <!-- 画面3: 結果 -->
  <div id="screen-result" class="card hide">
    <div class="summary">
      <div class="score" id="scoreText">0 / 0</div>
      <div class="score-sub" id="scoreSub">正答率 0%</div>
    </div>
    <div class="wrong-list" id="wrongList"></div>
    <div class="action-row">
      <button type="button" id="retryWrongBtn" class="ghost">間違えた単語だけ再挑戦</button>
      <button type="button" id="restartBtn">最初からやり直す</button>
    </div>
  </div>
</div>

<script>
// === password gate ===
const PW_HASH = 'd84fe7e07bedb227cffff10009151d96fc944f6a1bd37cff60e8e4626a1eb1c3';
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function unlock(){
  document.getElementById('gate').style.display='none';
  document.getElementById('mainContainer').style.display='';
}
if(localStorage.getItem('eigoUnlocked')==='1'){ unlock(); }
document.getElementById('gateForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const v = document.getElementById('gateInput').value;
  const h = await sha256(v);
  if(h===PW_HASH){
    localStorage.setItem('eigoUnlocked','1');
    unlock();
  } else {
    document.getElementById('gateErr').textContent = 'パスワードが違います';
    document.getElementById('gateInput').value='';
  }
});

"jp":"〜に偶然出会う"},{"no":"1459","word":"in charge of ~","pos":"熟","jp":"〜を担当して"},{"no":"1460","word":"make an effort","pos":"熟","jp":"努力する"},{"no":"1461","word":"pay attention to ~","pos":"熟","jp":"〜に注意を払う"},{"no":"1462","word":"rely on ~","pos":"熟","jp":"〜に頼る"},{"no":"1463","word":"be tired from ~","pos":"熟","jp":"〜で疲れている"},{"no":"1464","word":"change one's mind","pos":"熟","jp":"気が変わる"},{"no":"1465","word":"a bunch of ~","pos":"熟","jp":"たくさんの〜"},{"no":"1466","word":"ahead of ~","pos":"熟","jp":"〜の前に"},{"no":"1467","word":"be expected to do","pos":"熟","jp":"〜すると期待される"},{"no":"1468","word":"be impressed with ~","pos":"熟","jp":"〜に感銘を受ける"},{"no":"1469","word":"be in danger","pos":"熟","jp":"危険にさらされて"},{"no":"1470","word":"be said to be ~","pos":"熟","jp":"〜と言われている"},{"no":"1471","word":"be satisfied with ~","pos":"熟","jp":"〜に満足している"},{"no":"1472","word":"be unable to do","pos":"熟","jp":"〜できない"},{"no":"1473","word":"catch up with ~","pos":"熟","jp":"〜に追いつく"},{"no":"1474","word":"from now on","pos":"熟","jp":"これからは"},{"no":"1475","word":"get along with ~","pos":"熟","jp":"〜と仲良くやる"},{"no":"1476","word":"get over ~","pos":"熟","jp":"〜を克服する"},{"no":"1477","word":"go through ~","pos":"熟","jp":"〜を経験する"},{"no":"1478","word":"had better do","pos":"熟","jp":"〜すべきだ"},{"no":"1479","word":"hope for ~","pos":"熟","jp":"〜を望む"},{"no":"1480","word":"in advance","pos":"熟","jp":"前もって"},{"no":"1481","word":"in reality","pos":"熟","jp":"実際は"},{"no":"1482","word":"in spite of ~","pos":"熟","jp":"〜にもかかわらず"},{"no":"1483","word":"in the long run","pos":"熟","jp":"長い目で見れば"},{"no":"1484","word":"lead A to B","pos":"熟","jp":"AをBに導く"},{"no":"1485","word":"leave ~ behind","pos":"熟","jp":"〜を置き忘れる"},{"no":"1486","word":"look out","pos":"熟","jp":"注意する"},{"no":"1487","word":"make a difference","pos":"熟","jp":"重要である"},{"no":"1488","word":"make up for ~","pos":"熟","jp":"〜を埋め合わせる"},{"no":"1489","word":"mean to do","pos":"熟","jp":"〜するつもりである"},{"no":"1490","word":"on board ~","pos":"熟","jp":"〜に乗って"},{"no":"1491","word":"play an important role in ~","pos":"熟","jp":"〜で重要な役割を果たす"},{"no":"1492","word":"stand for ~","pos":"熟","jp":"〜を表す"},{"no":"1493","word":"start with ~","pos":"熟","jp":"〜から始まる"},{"no":"1494","word":"take A back to B","pos":"熟","jp":"AをBに返す"},{"no":"1495","word":"to one's surprise","pos":"熟","jp":"驚いたことに"},{"no":"1496","word":"watch out for ~","pos":"熟","jp":"〜に注意する"},{"no":"1497","word":"stay up late","pos":"熟","jp":"夜更かしする"},{"no":"1498","word":"as soon as ...","pos":"熟","jp":"〜するとすぐに"},{"no":"1499","word":"cheer A up","pos":"熟","jp":"Aを元気づける"},{"no":"1500","word":"name A after B","pos":"熟","jp":"AをBにちなんで名付ける"}];

// === state ===
let queue = [];   // list of word objects
let idx = 0;
let correctCount = 0;
let wrong = [];   // objects: {word, jp, pos, your}
let hintShown = false;
let answered = false;

// === error tracking (persistent) ===
let errors = {};
try { errors = JSON.parse(localStorage.getItem('eigoErrors') || '{}'); } catch(e){ errors = {}; }
function saveErrors(){ localStorage.setItem('eigoErrors', JSON.stringify(errors)); }
function recordError(w){ errors[w.word] = (errors[w.word]||0) + 1; saveErrors(); }
function updateStats(){
  const vals = Object.values(errors);
  const wordCount = vals.filter(c=>c>0).length;
  const total = vals.reduce((a,b)=>a+b, 0);
  document.getElementById('setupInfo').innerHTML =
    `全1495問（単語1100 + 熟語395）<br>累計間違い: ${wordCount}語 / ${total}回`;
}

// === helpers ===
const $ = id => document.getElementById(id);
function show(which){
  ['setup','quiz','judge','result'].forEach(s=>{
    $('screen-'+s).classList.toggle('hide', s!==which);
  });
}
function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }
function posLabel(p){
  return ({'動':'動詞','名':'名詞','形':'形容詞','副':'副詞','前':'前置詞','接':'接続詞','助':'助動詞','代':'代名詞','間':'間投詞','熟':'熟語'})[p] || p;
}

// === presets ===
function buildPresets(){
  const ranges = [[1,20],[21,40],[41,60],[61,80],[81,100],
                  [101,150],[151,200],[201,250],[251,300],
                  [301,400],[401,500],[501,600],[601,700],
                  [701,800],[801,900],[901,1000],[1001,1100],
                  [1101,1200],[1201,1300],[1301,1400],[1401,1500]];
  const c = $('presets');
  ranges.forEach(([a,b])=>{
    const btn = document.createElement('button');
    btn.textContent = `${a}-${b}`;
    btn.onclick = ()=>{ $('from').value=a; $('to').value=b; };
    c.appendChild(btn);
  });
}
buildPresets();
updateStats();

// === reset errors ===
document.getElementById('resetErrorsBtn').onclick = ()=>{
  if(Object.keys(errors).length===0){ alert('記録はまだありません'); return; }
  if(confirm('間違い記録をすべて削除しますか？')){
    errors = {};
    saveErrors();
    updateStats();
  }
};

// === start ===
$('startBtn').onclick = ()=>{
  const a = parseInt($('from').value), b = parseInt($('to').value);
  if(!(a>=1 && b>=a && b<=1500)){ alert('範囲が正しくありません'); return; }
  let pool = WORDS.filter(w=>{
    const n = parseInt(w.no);
    if(n<a || n>b) return false;
    if(!$('idiomToggle').checked && n>=1101) return false;
    return true;
  });
  if(pool.length===0){ alert('該当する単語がありません'); return; }
  const mode = $('orderMode').value;
  if(mode==='random'){
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  } else if(mode==='errors'){
    pool.sort((a,b)=>{
      const ea = errors[a.word]||0, eb = errors[b.word]||0;
      if(eb!==ea) return eb-ea;
      return a.no.localeCompare(b.no);
    });
  }
  queue = pool;
  idx = 0;
  correctCount = 0;
  wrong = [];
  showQuestion();
};

// === quiz ===
function showQuestion(){
  if(idx >= queue.length){ showResult(); return; }
  const w = queue[idx];
  answered = false;
  hintShown = false;
  $('progress').textContent = `${idx+1} / ${queue.length}（No.${w.no}）`;
  $('posTag').textContent = posLabel(w.pos);
  $('jpText').textContent = w.jp;
  $('hintText').textContent = '';
  $('answerInput').value = '';
  show('quiz');
  setTimeout(()=>$('answerInput').focus(),50);
}

$('hintBtn').onclick = ()=>{
  const w = queue[idx];
  if(hintShown){
    // show 2 letters on second press
    $('hintText').textContent = w.word.slice(0,2) + ' ...';
  } else {
    $('hintText').textContent = w.word[0] + ' ...';
    hintShown = true;
  }
  $('answerInput').focus();
};

$('skipBtn').onclick = ()=>{
  const w = queue[idx];
  wrong.push({word:w.word, jp:w.jp, pos:w.pos, your:'（スキップ）'});
  recordError(w);
  judge(false, w, '');
};

$('answerForm').onsubmit = (e)=>{ e.preventDefault(); doSubmit(); };
$('submitBtn').onclick = doSubmit;
function doSubmit(){
  if(answered) return;
  const w = queue[idx];
  const your = $('answerInput').value;
  const ok = normalize(your) === normalize(w.word);
  if(ok) correctCount++;
  else { wrong.push({word:w.word, jp:w.jp, pos:w.pos, your:your||'（未入力）'}); recordError(w); }
  judge(ok, w, your);
}

function judge(ok, w, your){
  answered = true;
  const el = $('judgeText');
  el.classList.remove('ok','ng');
  el.classList.add(ok?'ok':'ng');
  if(ok){
    el.innerHTML = `✓ 正解！ <strong>${w.word}</strong>`;
  } else {
    el.innerHTML = `✗ 不正解。正解: <strong>${w.word}</strong>` + (your ? `<br><small>あなたの答え: ${escapeHtml(your)}</small>` : '');
  }
  show('judge');
  setTimeout(()=>$('nextBtn').focus(),50);
}

$('nextBtn').onclick = ()=>{
  idx++;
  showQuestion();
};

$('quitBtn').onclick = ()=>{
  if(confirm('中断して最初の画面に戻りますか？')) show('setup');
};

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showResult(){
  const total = queue.length;
  const pct = total ? Math.round(correctCount/total*100) : 0;
  $('scoreText').textContent = `${correctCount} / ${total}`;
  $('scoreSub').textContent = `正答率 ${pct}%`;
  const wl = $('wrongList');
  wl.innerHTML = '';
  if(wrong.length){
    const h = document.createElement('h3');
    h.textContent = `間違えた単語 (${wrong.length})`;
    wl.appendChild(h);
    wrong.forEach(w=>{
      const d = document.createElement('div');
      d.className = 'wrong-item';
      const cnt = errors[w.word]||0;
      d.innerHTML = `<span class="w">${escapeHtml(w.word)}</span><span class="j">${posLabel(w.pos)} / ${escapeHtml(w.jp)} <small style="color:#999">累計${cnt}回</small></span>`;
      wl.appendChild(d);
    });
  } else {
    wl.innerHTML = '<h3 style="text-align:center;color:#2e7d32">全問正解！🎉</h3>';
  }
  $('retryWrongBtn').disabled = wrong.length===0;
  show('result');
}

$('retryWrongBtn').onclick = ()=>{
  if(wrong.length===0) return;
  queue = wrong.map(w=>WORDS.find(x=>x.word===w.word && x.jp===w.jp));
  idx = 0; correctCount = 0; wrong = [];
  if($('orderMode').value==='random'){
    for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  }
  showQuestion();
};

$('restartBtn').onclick = ()=>{ updateStats(); show('setup'); };
</script>
